<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camp Ads Agent</title>
  <style>
    :root {
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
      color: #16241b;
      background: #eef3f0;
      --green: #1f7a3d;
      --green-dark: #145c2c;
      --green-soft: #e8f3ec;
      --surface: #ffffff;
      --wash: #f7faf8;
      --line: #dbe5de;
      --muted: #5b6b60;
      --blue: #185fa5;
      --blue-soft: #e6f1fb;
      --amber: #9a6700;
      --amber-soft: #fff6e5;
      --red: #b00020;
      --red-soft: #fceaec;
      --violet: #5b3aa6;
      --violet-soft: #eeebfa;
      --shadow: 0 1px 3px rgba(20, 60, 40, .07), 0 10px 30px rgba(20, 60, 40, .08);
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: #eef3f0; min-height: 100dvh; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      max-width: 1320px;
      min-height: calc(100dvh - 24px);
      margin: 12px auto;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 58px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
    }

    .brand { font-weight: 850; color: var(--green-dark); letter-spacing: 0; }
    .brand span { color: var(--amber); }
    .topnote { color: var(--muted); font-size: 12px; font-weight: 650; }
    .spacer { flex: 1; }
    .ghost {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--green-dark);
      min-height: 38px;
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 750;
    }

    .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 42%) minmax(0, 1fr); }
    .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .pane.chat { background: var(--green-soft); border-right: 1px solid var(--line); }
    .pane.work { background: #fff; }
    .pane-head {
      min-height: 44px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.72);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .3px;
      text-transform: uppercase;
    }
    .badge.chat { background: var(--blue-soft); color: var(--blue); }
    .badge.work { background: var(--violet-soft); color: var(--violet); }
    .badge.good { background: var(--green-soft); color: var(--green-dark); }
    .badge.watch { background: var(--amber-soft); color: var(--amber); }
    .badge.bad { background: var(--red-soft); color: var(--red); }

    .thread {
      flex: 1;
      overflow: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { max-width: 92%; display: flex; gap: 10px; align-items: flex-start; }
    .msg.me { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      font-weight: 850;
      flex: 0 0 auto;
      background: var(--green);
    }
    .msg.me .avatar { background: var(--blue); }
    .bubble {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      border-top-left-radius: 4px;
      padding: 11px 14px;
      font-size: 14px;
      line-height: 1.55;
      box-shadow: 0 4px 16px rgba(20,60,40,.05);
    }
    .msg.me .bubble {
      border: 0;
      color: #fff;
      background: var(--blue);
      border-radius: 14px;
      border-top-right-radius: 4px;
    }
    .tool {
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #cbe4d2;
      background: var(--green-soft);
      color: var(--green-dark);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
    }
    .composer { border-top: 1px solid var(--line); padding: 12px 16px; background: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; }
    .chip {
      border: 1px solid #bfe0c9;
      background: var(--green-soft);
      color: var(--green-dark);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 720;
    }
    .inrow { display: flex; gap: 8px; }
    .inrow input {
      flex: 1;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
    }

    .stepper-wrap { padding: 14px 22px 8px; border-bottom: 1px solid var(--line); background: #fcfdfc; }
    .stepper { display: flex; gap: 6px; flex-wrap: wrap; }
    .stp {
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      background: #f1f5f2;
      color: var(--muted);
      border-radius: 999px;
      min-height: 32px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 780;
      white-space: nowrap;
    }
    .stp .n {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #cdd8d0;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .stp.done { color: var(--green-dark); background: var(--green-soft); border-color: #bfe0c9; cursor: pointer; }
    .stp.done .n { background: var(--green); }
    .stp.cur { color: #fff; background: var(--green); border-color: var(--green); }
    .stp.cur .n { color: var(--green); background: #fff; }
    .stp.locked { opacity: .52; }
    .progress-line { height: 4px; background: #eef3f0; border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .progress-line span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--green), #5fcf7a); transition: width .28s ease; }

    .work-body { flex: 1; overflow: auto; padding: 22px 24px; }
    .step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .step-head .num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid #bfe0c9;
      background: var(--green-soft);
      color: var(--green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 850;
    }
    .step-head h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
    .step-desc { margin: 0 0 16px 46px; color: var(--muted); font-size: 14px; max-width: 760px; }
    .work-foot {
      border-top: 1px solid var(--line);
      padding: 14px 22px;
      background: #fcfdfc;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hint { flex: 1; font-size: 12px; color: var(--muted); }

    .label { display: block; margin: 12px 0 6px; color: var(--amber); font-size: 11px; font-weight: 850; letter-spacing: .45px; text-transform: uppercase; }
    .input, textarea, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      font-size: 16px;
    }
    textarea { min-height: 136px; resize: vertical; line-height: 1.5; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-weight: 780;
      padding: 10px 16px;
    }
    .btn.secondary { background: #fff; color: var(--green-dark); border: 1px solid var(--line); }
    .btn.blue { background: var(--blue); }
    .btn.amber { background: var(--amber); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .drop {
      display: block;
      border: 2px dashed #c4d6cb;
      border-radius: 10px;
      padding: 18px;
      background: var(--green-soft);
      color: var(--muted);
      cursor: pointer;
      min-height: 96px;
    }
    .drop.has { border-style: solid; border-color: var(--green); background: #fff; }
    .drop b { color: var(--green-dark); }
    .preview-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; align-items: start; }
    .phone {
      width: 230px;
      margin: 0 auto;
      background: #0c1013;
      border-radius: 30px;
      padding: 9px;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }
    .phone-screen { height: 400px; background: #fff; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; }
    .phonebar { height: 24px; background: #f1f5f2; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; color: #7a827c; font-size: 10px; font-weight: 800; }
    .adcard { margin: 10px; padding: 8px; border: 1px solid #e3e7ea; border-radius: 8px; background: #fafbfd; }
    .creative-box { height: 150px; border-radius: 7px; background: linear-gradient(135deg, #1f7a3d, #66cf80); color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-weight: 850; overflow: hidden; }
    .creative-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .adcard h3 { margin: 8px 0 2px; font-size: 13px; }
    .adcard p { margin: 0; color: var(--muted); font-size: 11px; }
    .cta { margin-top: 8px; color: #fff; background: var(--green); border-radius: 6px; padding: 6px; text-align: center; font-size: 11px; font-weight: 800; }

    .notice { border-left: 4px solid var(--amber); background: var(--amber-soft); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 14px; color: #4b3a13; margin-top: 12px; }
    .donebox { border: 1px solid #bfe0c9; background: var(--green-soft); border-radius: 10px; padding: 12px 14px; color: var(--green-dark); font-weight: 720; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric { border: 1px solid var(--line); background: var(--wash); border-radius: 10px; padding: 11px; min-height: 78px; }
    .metric span { display: block; font-size: 11px; color: var(--muted); font-weight: 850; text-transform: uppercase; }
    .metric b { display: block; margin-top: 5px; font-size: 21px; color: var(--green-dark); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid #e7eee9; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .section-title { margin: 18px 0 8px; font-size: 14px; color: #1f3551; }
    pre { background: #102018; color: #d9f1df; border-radius: 10px; padding: 12px; overflow: auto; max-height: 300px; font-size: 12px; }

    @media (max-width: 980px) {
      .app { margin: 0; min-height: 100dvh; border-radius: 0; border-left: 0; border-right: 0; }
      .main { grid-template-columns: 1fr; }
      .pane.chat { min-height: 42dvh; border-right: 0; border-bottom: 1px solid var(--line); }
      .preview-grid, .cols, .grid2, .metric-grid { grid-template-columns: 1fr; }
      .work-foot { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Camp <span>Ads</span> Agent</div>
      <div class="topnote">Split Chat + Workspace · progressive disclosure</div>
      <div class="spacer"></div>
      <button class="ghost" type="button" onclick="restartFlow()">Reset</button>
    </header>

    <main class="main">
      <section class="pane chat" aria-label="Chat UI">
        <div class="pane-head"><span class="badge chat">CHAT</span>Chat UI</div>
        <div class="thread" id="thread"></div>
        <div class="composer">
          <div class="chips">
            <button class="chip" type="button" onclick="quickAsk('Parse this brief')">Parse brief</button>
            <button class="chip" type="button" onclick="quickAsk('Analyze campaign reports')">Analyze report</button>
            <button class="chip" type="button" onclick="quickAsk('Create AO alert')">Build alert</button>
          </div>
          <div class="inrow">
            <input id="chatInput" placeholder="Ask the agent about the current step" aria-label="Chat message">
            <button class="btn blue" type="button" onclick="sendChat()">Send</button>
          </div>
        </div>
      </section>

      <section class="pane work" aria-label="Workspace">
        <div class="pane-head"><span class="badge work">WORKSPACE</span>Current step form and result</div>
        <div class="stepper-wrap">
          <div class="stepper" id="stepper"></div>
          <div class="progress-line"><span id="progress"></span></div>
        </div>
        <div class="work-body" id="workBody"></div>
        <div class="work-foot" id="workFoot"></div>
      </section>
    </main>
  </div>

  <script>
    const steps = [
      { id: "brief", title: "Brief", tool: "brief_parse", desc: "Paste the client brief. The agent parses objective, KPI, target, budget, and funnel before opening the next step." },
      { id: "creative", title: "Creative", tool: "creative_inspect", desc: "Upload creative material through the workspace. The agent checks file metadata and shows a mobile preview." },
      { id: "zones", title: "Zones", tool: "zone_recommend", desc: "Recommend ad zones by objective, price, reach, VI, CTR, and CPM." },
      { id: "dmp", title: "DMP", tool: "dmp_match", desc: "Map the brief target to DMP segments and flag missing terms with proxy suggestions." },
      { id: "setup", title: "Setup", tool: "setup_plan", desc: "Create campaign draft setup with zone plan, budget split, bid strategy, and schedule." },
      { id: "report", title: "Report", tool: "report_analyze", desc: "Analyze 15 report sheets and 480 campaign records into good, watch, and bad groups." },
      { id: "alert", title: "Alert", tool: "ao_alert", desc: "Build the AO/account action alert from records that need intervention." },
    ];

    const defaultBrief = "Brand: ShieldCare Insurance\\nThu lead bao hiem suc khoe. Budget 150 trieu. KPI CPL, CR, ROAS. Target Health, Insurance, Finance, Du hoc.";
    const state = {
      current: 0,
      done: Array(7).fill(false),
      briefText: defaultBrief,
      brief: null,
      creative: null,
      zones: null,
      dmp: null,
      setup: null,
      report: null,
      alert: null,
      context: null,
      chat: [],
    };

    const els = {
      thread: document.getElementById("thread"),
      stepper: document.getElementById("stepper"),
      progress: document.getElementById("progress"),
      workBody: document.getElementById("workBody"),
      workFoot: document.getElementById("workFoot"),
      chatInput: document.getElementById("chatInput"),
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function fmt(n) { return Number(n || 0).toLocaleString("vi-VN"); }
    function money(n) { return `${fmt(n)}d`; }
    function step() { return steps[state.current]; }
    function canEnter(index) { return index === 0 || state.done[index - 1] || state.done[index]; }
    function markDone(index) { state.done[index] = true; }
    function nextStep() { if (state.current < steps.length - 1) { state.current += 1; renderAll(); botIntro(); } }
    function setCurrent(index) { if (canEnter(index)) { state.current = index; renderAll(); } }

    async function api(path, options) {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    function bot(text, tool = step().tool) {
      state.chat.push({ who: "bot", text, tool });
      renderThread();
    }

    function me(text) {
      state.chat.push({ who: "me", text });
      renderThread();
    }

    function renderThread() {
      els.thread.innerHTML = state.chat.map(msg => `
        <div class="msg ${msg.who === "me" ? "me" : "bot"}">
          <div class="avatar">${msg.who === "me" ? "U" : "AI"}</div>
          <div class="bubble">
            ${esc(msg.text)}
            ${msg.tool ? `<div class="tool">${esc(msg.tool)} · ${modelForTool(msg.tool)}</div>` : ""}
          </div>
        </div>
      `).join("");
      els.thread.scrollTop = els.thread.scrollHeight;
    }

    function modelForTool(tool) {
      if (tool.includes("report") || tool.includes("dmp") || tool.includes("setup") || tool.includes("zone")) return "Gemma 4 31B-IT";
      if (tool.includes("alert")) return "Qwen 3.5 27B";
      return "MiniMax M2.5";
    }

    function renderStepper() {
      els.stepper.innerHTML = steps.map((s, i) => {
        const status = state.done[i] ? "done" : i === state.current ? "cur" : canEnter(i) ? "" : "locked";
        return `<button class="stp ${status}" type="button" ${canEnter(i) ? `onclick="setCurrent(${i})"` : "disabled"}>
          <span class="n">${state.done[i] ? "✓" : i + 1}</span>${esc(s.title)}
        </button>`;
      }).join("");
      const doneCount = state.done.filter(Boolean).length;
      els.progress.style.width = `${Math.round(doneCount / steps.length * 100)}%`;
    }

    function renderAll() {
      renderStepper();
      const s = step();
      els.workBody.innerHTML = `
        <div class="step-head"><div class="num">${state.done[state.current] ? "✓" : state.current + 1}</div><h1>${esc(s.title)}</h1></div>
        <p class="step-desc">${esc(s.desc)}</p>
        ${renderStep()}
      `;
      renderFoot();
      bindStep();
    }

    function renderFoot() {
      const isDone = state.done[state.current];
      els.workFoot.innerHTML = `
        <div class="hint">Tool: <b>${esc(step().tool)}</b> · Model lane: <b>${modelForTool(step().tool)}</b></div>
        ${state.current > 0 ? `<button class="btn secondary" type="button" onclick="setCurrent(${state.current - 1})">Back</button>` : ""}
        ${isDone && state.current < steps.length - 1 ? `<button class="btn" type="button" onclick="nextStep()">Next step</button>` : ""}
        ${isDone && state.current === steps.length - 1 ? `<button class="btn" type="button" disabled>Flow complete</button>` : ""}
      `;
    }

    function renderStep() {
      return [
        renderBrief,
        renderCreative,
        renderZones,
        renderDmp,
        renderSetup,
        renderReport,
        renderAlert,
      ][state.current]();
    }

    function renderBrief() {
      const brief = state.brief;
      return `
        <label class="label" for="briefText">Client brief</label>
        <textarea id="briefText">${esc(state.briefText)}</textarea>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn" type="button" onclick="parseBrief()">Parse brief</button>
          <button class="btn secondary" type="button" onclick="loadSampleBrief()">Reset sample</button>
        </div>
        ${brief ? `
          <h2 class="section-title">Parsed output</h2>
          <div class="metric-grid">
            <div class="metric"><span>Brand</span><b>${esc(brief.brand)}</b></div>
            <div class="metric"><span>Funnel</span><b>${esc(brief.funnel_stage)}</b></div>
            <div class="metric"><span>Budget</span><b>${money(brief.budget_vnd)}</b></div>
            <div class="metric"><span>KPI</span><b>${esc(brief.kpi.join(" / "))}</b></div>
          </div>
          <div class="donebox" style="margin-top:12px">Brief parsed. You can continue to Creative.</div>
        ` : `<div class="notice">Only this brief field is active now. Parse it before the agent opens creative upload.</div>`}
      `;
    }

    function renderCreative() {
      const c = state.creative;
      const preview = c && c.content_type && c.content_type.startsWith("image/") && c.preview
        ? `<img src="${esc(c.preview)}" alt="Creative preview">`
        : `<span>${c ? esc(c.filename) : "Creative preview"}</span>`;
      return `
        <div class="preview-grid">
          <div>
            <label class="label" for="creativeInput">Upload creative</label>
            <label class="drop ${c ? "has" : ""}" for="creativeInput">
              ${c ? `<b>${esc(c.filename)}</b><div>${esc(c.content_type)} · ${fmt(c.size_bytes)} bytes</div>` : `<b>Choose a creative file</b><div>PNG, JPG, MP4, or a mock text file for local testing.</div>`}
            </label>
            <input id="creativeInput" type="file" style="display:none">
            ${c ? `<div class="donebox" style="margin-top:12px">Creative accepted. You can continue to zone recommendation.</div>` : `<div class="notice">The flow waits here until a creative is uploaded.</div>`}
          </div>
          <div class="phone" aria-label="Mobile creative preview">
            <div class="phone-screen">
              <div class="phonebar"><span>9:41</span><span>AD</span></div>
              <div class="adcard">
                <div class="creative-box">${preview}</div>
                <h3>${esc((state.brief && state.brief.brand) || "Demo Brand")}</h3>
                <p>Preview placement before campaign setup.</p>
                <div class="cta">Learn more</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderZones() {
      const zones = state.zones || [];
      return `
        <button class="btn" type="button" onclick="recommendZones()">Recommend zones</button>
        ${zones.length ? `
          <h2 class="section-title">Zone recommendation</h2>
          <table>
            <thead><tr><th>Zone</th><th>Reach</th><th>VI</th><th>CTR</th><th>CPM</th><th>Reason</th></tr></thead>
            <tbody>${zones.map(z => `<tr><td>${esc(z.zone_id)}</td><td>${fmt(z.reach)}</td><td>${z.vi_pct}%</td><td>${z.ctr_pct}%</td><td>${money(z.cpm_vnd)}</td><td>${esc(z.fit_reason)}</td></tr>`).join("")}</tbody>
          </table>
          <div class="donebox" style="margin-top:12px">Zones selected by objective, price, and performance.</div>
        ` : `<div class="notice">Zone recommendation is a separate step before DMP mapping.</div>`}
      `;
    }

    function renderDmp() {
      const dmp = state.dmp;
      return `
        <button class="btn" type="button" onclick="mapDmp()">Map DMP segment</button>
        ${dmp ? `
          <div class="metric-grid" style="margin-top:12px">
            <div class="metric"><span>Audience size</span><b>${fmt(dmp.size_est)}</b></div>
            <div class="metric"><span>Matched</span><b>${dmp.matched.length}</b></div>
            <div class="metric"><span>Gaps</span><b>${dmp.gaps.length}</b></div>
            <div class="metric"><span>Status</span><b>${dmp.gaps.length ? "Proxy" : "Ready"}</b></div>
          </div>
          <div class="cols">
            <div>
              <h2 class="section-title">Matched segments</h2>
              <table><thead><tr><th>Segment</th><th>Size</th><th>Category</th></tr></thead><tbody>
              ${dmp.matched.map(s => `<tr><td>${esc(s.name)}</td><td>${fmt(s.size)}</td><td>${esc(s.category)}</td></tr>`).join("") || `<tr><td colspan="3">No segment matched</td></tr>`}
              </tbody></table>
            </div>
            <div>
              <h2 class="section-title">Gaps and proxies</h2>
              <table><thead><tr><th>Term</th><th>Proxy</th></tr></thead><tbody>
              ${dmp.gaps.map(g => `<tr><td><span class="badge bad">${esc(g.term)}</span></td><td>${esc(g.suggested_proxy)}</td></tr>`).join("") || `<tr><td colspan="2"><span class="badge good">No major gap</span></td></tr>`}
              </tbody></table>
            </div>
          </div>
        ` : `<div class="notice">DMP uses the parsed brief target. Run mapping before campaign setup.</div>`}
      `;
    }

    function renderSetup() {
      const setup = state.setup;
      return `
        <button class="btn" type="button" onclick="runSetup()">Run setup</button>
        ${setup ? `
          <div class="donebox" style="margin-top:12px">${esc(setup.readout)}</div>
          <div class="cols">
            <div>
              <h2 class="section-title">Budget split</h2>
              <table><thead><tr><th>Zone</th><th>Share</th><th>Budget</th><th>CPM</th></tr></thead><tbody>
              ${setup.budget_split.map(row => `<tr><td>${esc(row.zone_id)}</td><td>${row.share_pct}%</td><td>${money(row.budget_vnd)}</td><td>${money(row.expected_cpm_vnd)}</td></tr>`).join("")}
              </tbody></table>
            </div>
            <div>
              <h2 class="section-title">Campaign drafts</h2>
              <table><thead><tr><th>ID</th><th>Name</th><th>Status</th></tr></thead><tbody>
              ${setup.campaigns.map(c => `<tr><td>${esc(c.campaign_id)}</td><td>${esc(c.name)}</td><td><span class="badge watch">${esc(c.status)}</span></td></tr>`).join("")}
              </tbody></table>
            </div>
          </div>
          <h2 class="section-title">Bid strategy</h2>
          <pre>${esc(setup.bid_strategy)}</pre>
        ` : `<div class="notice">Setup runs only after brief, creative, zone, and DMP steps are complete.</div>`}
      `;
    }

    function renderReport() {
      const report = state.report;
      return `
        <button class="btn" type="button" onclick="runReport()">Analyze report</button>
        ${report ? `
          <div class="metric-grid" style="margin-top:12px">
            <div class="metric"><span>Records</span><b>${report.total_records}</b></div>
            <div class="metric"><span>Reports</span><b>${report.reports}</b></div>
            <div class="metric"><span>ROAS</span><b>${Number(report.total_roas).toFixed(2)}x</b></div>
            <div class="metric"><span>Bad</span><b>${report.verdict.bad}</b></div>
          </div>
          <h2 class="section-title">Top records to review</h2>
          <table><thead><tr><th>Campaign</th><th>Brand</th><th>Zone</th><th>ROAS</th><th>Hint</th></tr></thead><tbody>
          ${report.top_bad.slice(0, 6).map(r => `<tr><td>${esc(r.campaign_id)}</td><td>${esc(r.brand)}</td><td>${esc(r.zone)}</td><td>${esc(r.roas)}</td><td>${esc(r.hint)}</td></tr>`).join("")}
          </tbody></table>
        ` : `<div class="notice">Report analysis is intentionally late in the flow, after setup is ready.</div>`}
      `;
    }

    function renderAlert() {
      const alert = state.alert;
      return `
        <button class="btn amber" type="button" onclick="buildAlert()">Build alert</button>
        ${alert ? `
          <h2 class="section-title">AO alert</h2>
          <div class="donebox">${esc(alert.subject)}</div>
          <pre>${esc(alert.body)}</pre>
        ` : `<div class="notice">This final step creates the message for AO/account teams from report findings.</div>`}
      `;
    }

    function bindStep() {
      if (state.current === 1) {
        const input = document.getElementById("creativeInput");
        input.addEventListener("change", inspectCreative);
      }
    }

    async function parseBrief() {
      const text = document.getElementById("briefText").value;
      state.briefText = text;
      const res = await api("/api/brief/parse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      state.brief = res.data;
      markDone(0);
      me("Brief submitted");
      bot(`Parsed ${state.brief.brand}. Funnel is ${state.brief.funnel_stage}; budget is ${money(state.brief.budget_vnd)}.`, "brief_parse");
      renderAll();
    }

    function loadSampleBrief() {
      state.briefText = defaultBrief;
      renderAll();
    }

    async function inspectCreative(event) {
      const file = event.target.files[0];
      if (!file) return;
      const body = new FormData();
      body.append("file", file);
      const res = await api("/api/creative/inspect", { method: "POST", body });
      state.creative = res.data;
      if (file.type && file.type.startsWith("image/")) {
        state.creative.preview = URL.createObjectURL(file);
      }
      markDone(1);
      me(`Uploaded ${file.name}`);
      bot(`Creative accepted: ${file.name}. Next I can recommend zones.`, "creative_inspect");
      renderAll();
    }

    async function recommendZones() {
      const objective = (state.brief && state.brief.funnel_stage) || "conversion";
      const res = await api("/api/zones/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ objective, budget_vnd: state.brief && state.brief.budget_vnd, top_n: 5 }),
      });
      state.zones = res.data.zones;
      markDone(2);
      me("Recommend zones");
      bot(`Recommended ${state.zones.length} zones for ${objective}, including price and performance signals.`, "zone_recommend");
      renderAll();
    }

    async function mapDmp() {
      const target = (state.brief && state.brief.target) || { interests: [] };
      const res = await api("/api/dmp/match", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target }),
      });
      state.dmp = res.data;
      markDone(3);
      me("Map DMP segment");
      bot(`Matched ${state.dmp.matched.length} segments, estimated size ${fmt(state.dmp.size_est)}, gaps ${state.dmp.gaps.length}.`, "dmp_match");
      renderAll();
    }

    async function runSetup() {
      const res = await api("/api/setup/plan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ brief_text: state.briefText, creative: state.creative, top_n: 5 }),
      });
      state.setup = res.data;
      markDone(4);
      me("Run setup");
      bot(state.setup.readout, "setup_plan");
      renderAll();
    }

    async function runReport() {
      const res = await api("/api/reports/analyze");
      state.report = res.data;
      markDone(5);
      me("Analyze report");
      bot(`Analyzed ${state.report.total_records} rows across ${state.report.reports} reports. ROAS is ${Number(state.report.total_roas).toFixed(2)}x.`, "report_analyze");
      renderAll();
    }

    async function buildAlert() {
      const res = await api("/api/alerts/ao", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ max_items: 6 }),
      });
      state.alert = res.data;
      markDone(6);
      me("Build alert");
      bot(state.alert.subject, "ao_alert");
      renderAll();
    }

    async function sendChat() {
      const text = els.chatInput.value.trim();
      if (!text) return;
      els.chatInput.value = "";
      me(text);
      const res = await api("/invocations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, creative: state.creative, top_n: 5 }),
      });
      bot(res.data.reply, res.data.action);
    }

    function quickAsk(text) {
      els.chatInput.value = text;
      sendChat();
    }

    function botIntro() {
      const s = step();
      bot(`Step ${state.current + 1}: ${s.title}. ${s.desc}`, s.tool);
    }

    function restartFlow() {
      state.current = 0;
      state.done = Array(7).fill(false);
      state.briefText = defaultBrief;
      state.brief = null;
      state.creative = null;
      state.zones = null;
      state.dmp = null;
      state.setup = null;
      state.report = null;
      state.alert = null;
      state.chat = [];
      renderAll();
      bot("Hi, I am Camp Ads Agent. I will guide the campaign flow step by step. Start with the Brief panel on the right.", "brief_parse");
    }

    els.chatInput.addEventListener("keydown", event => {
      if (event.key === "Enter") sendChat();
    });

    api("/api/context").then(res => {
      state.context = res.data;
      restartFlow();
    }).catch(err => {
      state.chat.push({ who: "bot", text: String(err), tool: "runtime" });
      renderAll();
      renderThread();
    });
  </script>
</body>
</html>
